name: amsonia-core

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amsonia_core
      POSTGRES_USER: amsonia_owner
      POSTGRES_PASSWORD: ${AMSONIA_POSTGRES_OWNER_PASSWORD:?set owner password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amsonia_owner -d amsonia_core"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    entrypoint: ["/usr/local/bin/amsonia", "migrate"]
    environment:
      AMSONIA_MIGRATION_DSN: host=postgres port=5432 dbname=amsonia_core user=amsonia_owner sslmode=disable
      PGPASSWORD: ${AMSONIA_POSTGRES_OWNER_PASSWORD:?set owner password}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  database-roles:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${AMSONIA_POSTGRES_OWNER_PASSWORD:?set owner password}
      AMSONIA_POSTGRES_RUNTIME_PASSWORD: ${AMSONIA_POSTGRES_RUNTIME_PASSWORD:?set runtime password}
      AMSONIA_POSTGRES_MAINTENANCE_PASSWORD: ${AMSONIA_POSTGRES_MAINTENANCE_PASSWORD:?set maintenance password}
      AMSONIA_RUNTIME_SECRET_HEX: ${AMSONIA_RUNTIME_SECRET_HEX:?set runtime binding secret}
      AMSONIA_MAINTENANCE_SECRET_HEX: ${AMSONIA_MAINTENANCE_SECRET_HEX:?set maintenance binding secret}
    volumes:
      - ./ops:/ops:ro
    command:
      - psql
      - --host=postgres
      - --username=amsonia_owner
      - --dbname=amsonia_core
      - --file=/ops/compose_configure_roles.sql
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      AMSONIA_DATABASE_DSN: host=postgres port=5432 dbname=amsonia_core user=amsonia_runtime sslmode=disable
      PGPASSWORD: ${AMSONIA_POSTGRES_RUNTIME_PASSWORD:?set runtime password}
      AMSONIA_TENANT_BINDING_SECRET: ${AMSONIA_TENANT_BINDING_SECRET:?set unpadded base64url runtime secret}
      AMSONIA_HTTP_ADDR: :8080
    depends_on:
      database-roles:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/amsonia-api", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${AMSONIA_WEB_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
