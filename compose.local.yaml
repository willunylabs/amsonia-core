# Local-only ports used by `make demo`. The Console and PostgreSQL are
# reachable from the host for browser and integration examples.
services:
  postgres:
    ports:
      - "127.0.0.1:${AMSONIA_POSTGRES_PORT:-55432}:5432"
  web:
    ports: !override
      - "127.0.0.1:${AMSONIA_WEB_PORT:-8080}:8080"
