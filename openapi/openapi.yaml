                                  "type": "string",
                                  "enum": ["tenant", "own", "workspace"],
                                },
                              "workspace_roles":
                                {
                                  "type": ["array", "null"],
                                  "items": { "type": "string" },
                                },
                            },
                        },
                    },
                },
            },
          "parameters":
            [
              {
                "name": "tenant_id",
                "in": "path",
                "required": true,
                "schema":
                  { "type": "string", "minLength": 1, "maxLength": 256 },
              },
              {
                "name": "role_id",
                "in": "path",
                "required": true,
                "schema":
                  { "type": "string", "minLength": 1, "maxLength": 256 },
              },
            ],
        },
      "delete":
        {
          "operationId": "revokePermission",
          "summary": "Revoke a scoped permission grant",
          "description": "Requires tenant-wide iam:grant:manage plus actual coverage of the permission and scope being delegated. Stale versions and last-administrator removal return 409.",
          "tags": ["Tenants"],
          "security": [{ "bearerAuth": [] }],
          "responses":
            {
              "200":
                {
                  "description": "Completed.",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/MutationResult" },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "401": { "$ref": "#/components/responses/Unauthorized" },
              "403": { "$ref": "#/components/responses/Forbidden" },
              "404": { "$ref": "#/components/responses/NotFound" },
              "409": { "$ref": "#/components/responses/Conflict" },
              "429": { "$ref": "#/components/responses/TooManyRequests" },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "additionalProperties": false,
                          "required":
                            ["expected_version", "permission", "scope"],
                          "properties":
                            {
                              "expected_version":
                                { "type": "integer", "minimum": 1 },
                              "permission": { "type": "string" },
                              "scope":
                                {
                                  "type": "string",
                                  "enum": ["tenant", "own", "workspace"],
                                },
                              "workspace_roles":
                                {
                                  "type": ["array", "null"],
                                  "items": { "type": "string" },
                                },
                            },
                        },
                    },
                },
            },
          "parameters":
            [
              {
                "name": "tenant_id",
                "in": "path",
                "required": true,
                "schema":
                  { "type": "string", "minLength": 1, "maxLength": 256 },
              },
              {
                "name": "role_id",
                "in": "path",
                "required": true,
                "schema":
                  { "type": "string", "minLength": 1, "maxLength": 256 },
              },
            ],
        },
    }
  /api/v1/tenants/{tenant_id}/roles/{role_id}/members:
    get:
      summary: Search members assigned or available to a role
      operationId: listRoleMembers
      tags:
        - Tenants
      security:
        - bearerAuth: []
      description: >-
        Requires tenant-wide iam:role:read and iam:member:read. Assigned members include suspended
        memberships; available members are tenant members without this binding. Suspended members
        cannot receive new assignments through the existing versioned binding endpoint. Cursor,
        totals, search and status semantics match the member directory, with cursors also bound to
        role and assignment view.
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: role_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - $ref: "#/components/parameters/DirectoryQuery"
        - $ref: "#/components/parameters/DirectoryLimit"
        - $ref: "#/components/parameters/DirectoryAfter"
        - name: assignment
          in: query
          schema:
            type: string
            enum:
              - assigned
              - available
            default: assigned
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - suspended
      responses:
        "200":
          description: A bounded collection page.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Member"
                  total:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Total matching rows before applying the cursor, in the same request snapshot.
                  next_cursor:
                    type: string
                    maxLength: 8192
                    description: Pass unchanged as after with the same search and status. Absent at the end.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    refreshCookie:
      type: apiKey
      in: cookie
      name: amsonia_refresh
  parameters:
    AuditFrom:
      name: from
      in: query
      description: >-
        Inclusive event timestamp in RFC3339 with UTC offset or Z, years 0001–9999. Must precede until
        when both are supplied.
      schema:
        type: string
        format: date-time
    AuditUntil:
      name: until
      in: query
      description: >-
        Exclusive event timestamp in RFC3339 with UTC offset or Z, years 0001–9999. Must follow from
        when both are supplied.
      schema:
        type: string
        format: date-time
    DirectoryQuery:
      name: q
      in: query
      description: Literal search text, trimmed; no SQL wildcard expansion.
      schema:
        type: string
        maxLength: 128
    DirectoryLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    DirectoryAfter:
      name: after
      in: query
      schema:
        type: string
        maxLength: 8192
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
  responses:
    BadRequest:
      description: Invalid input.
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Authentication or session is invalid.
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: The current account lacks required authority.
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Resource is missing or intentionally hidden.
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Version or uniqueness conflict.
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TooManyRequests:
      description: Login is temporarily locked.
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    OrganizationSettings:
      type: object
      required: [id, name, state, version, created_at, updated_at, can_manage]
      properties:
        id: { type: string }
        name: { type: string }
        state: { type: string, const: active }
        version: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        can_manage: { type: boolean }

    Account:
      type: object
      required: [id, email, system_admin, created_at]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        system_admin: { type: boolean }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }
    Session:
      type: object
      required: [access_token, expires_at, account]
      properties:
        access_token: { type: string, pattern: "^as_" }
        expires_at: { type: string, format: date-time }
        account: { $ref: "#/components/schemas/Account" }
    Tenant:
      type: object
      required: [id, name, state, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        state: { type: string, enum: [pending, active, failed] }
        created_at: { type: string, format: date-time }
    Member:
      type: object
      required: [account_id, email, status, joined_at]
      properties:
        account_id: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [active, suspended] }
        joined_at: { type: string, format: date-time }
    Permission:
      type: object
      required: [key, description]
      properties:
        key: { type: string }
        description: { type: string }
    Capabilities:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: object
          additionalProperties: { type: boolean }
    Role:
      type: object
      required: [tenant_id, role_id, name, description, version]
      properties:
        tenant_id: { type: string }
        role_id: { type: string }
        name: { type: string }
        description: { type: string }
        version: { type: integer, minimum: 1 }
        deleted: { type: boolean }
    AuditEvent:
      type: object
      required:
        [id, tenant_id, operation, phase, target_type, target_id, outcome, at]
      properties:
        id: { type: integer, minimum: 1 }
        host_initiator: { type: string }
        tenant_id: { type: string }
        actor_subject_id: { type: string }
        operation: { type: string }
        phase: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        outcome: { type: string }
        reason_code: { type: string }
        request_id: { type: string }
        role_version: { type: integer }
        at: { type: string, format: date-time }
    ResourceContext:
      type: object
      additionalProperties: false
      properties:
        tenant_id: { type: string }
        resource_id: { type: string }
        owner_subject_id: { type: string }
        workspace_id: { type: string }
    AuthorizationCheck:
      type: object
      additionalProperties: false
      required: [tenant_id, permission, mode, resource]
      properties:
        tenant_id: { type: string }
        subject_id:
          { type: string, description: Defaults to the current account. }
        permission: { type: string }
        mode: { type: string, enum: [existing, create, tenant_action] }
        resource: { $ref: "#/components/schemas/ResourceContext" }
    Decision:
      type: object
      required: [allowed, reason]
      properties:
        allowed: { type: boolean }
        reason: { type: string }
        effective_scope: { type: string, enum: [own, workspace, tenant] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    Profile:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["id", "email", "display_name", "created_at"],
        "properties":
          {
            "id": { "type": "string" },
            "email": { "type": "string", "format": "email" },
            "display_name": { "type": "string", "maxLength": 80 },
            "created_at": { "type": "string", "format": "date-time" },
          },
      }
    AccountSession:
      {
        "type": "object",
        "additionalProperties": false,
        "required":
          [
            "id",
            "created_at",
            "last_seen_at",
            "expires_at",
            "remote_address",
            "user_agent",
            "current",
          ],
        "properties":
          {
            "id": { "type": "string" },
            "created_at": { "type": "string", "format": "date-time" },
            "last_seen_at": { "type": "string", "format": "date-time" },
            "expires_at": { "type": "string", "format": "date-time" },
            "remote_address": { "type": "string" },
            "user_agent": { "type": "string" },
            "current": { "type": "boolean" },
          },
      }
    Invitation:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["id", "email", "expires_at", "created_at", "status"],
        "properties":
          {
            "id": { "type": "string" },
            "email": { "type": "string", "format": "email" },
            "expires_at": { "type": "string", "format": "date-time" },
            "created_at": { "type": "string", "format": "date-time" },
            "status":
              {
                "type": "string",
                "enum": ["pending", "accepted", "revoked", "expired"],
              },
          },
      }
    CreatedInvitation:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["id", "email", "expires_at", "created_at", "token"],
        "properties":
          {
            "id": { "type": "string" },
            "email": { "type": "string", "format": "email" },
            "expires_at": { "type": "string", "format": "date-time" },
            "created_at": { "type": "string", "format": "date-time" },
            "token":
              {
                "type": "string",
                "description": "Shown once. Store privately; share using a URL fragment.",
              },
          },
      }
    InvitationPreview:
      {
        "type": "object",
        "additionalProperties": false,
        "required":
          [
            "id",
            "tenant_id",
            "email",
            "tenant_name",
            "expires_at",
            "account_exists",
          ],
        "properties":
          {
            "id": { "type": "string" },
            "tenant_id": { "type": "string" },
            "email": { "type": "string", "format": "email" },
            "tenant_name": { "type": "string" },
            "expires_at": { "type": "string", "format": "date-time" },
            "account_exists": { "type": "boolean" },
          },
      }
    ScopedPermission:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["permission", "scope"],
        "properties":
          {
            "permission": { "type": "string" },
            "scope":
              { "type": "string", "enum": ["tenant", "own", "workspace"] },
            "workspace_roles":
              { "type": ["array", "null"], "items": { "type": "string" } },
          },
      }
    RoleHistory:
      {
        "type": "object",
        "additionalProperties": false,
        "required":
          [
            "version",
            "name",
            "description",
            "grants",
            "created_at",
            "created_by",
          ],
        "properties":
          {
            "version": { "type": "integer", "minimum": 1 },
            "name": { "type": "string" },
            "description": { "type": "string" },
            "grants":
              {
                "type": "array",
                "items": { "$ref": "#/components/schemas/ScopedPermission" },
              },
            "created_at": { "type": "string", "format": "date-time" },
            "created_by": { "type": "string" },
          },
      }
    RoleDetail:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["role", "grants", "subjects", "versions"],
        "properties":
          {
            "role": { "$ref": "#/components/schemas/Role" },
            "grants":
              {
                "type": "array",
                "items": { "$ref": "#/components/schemas/ScopedPermission" },
              },
            "subjects": { "type": "array", "items": { "type": "string" } },
            "subject_count":
              {
                "type": "integer",
                "format": "int64",
                "minimum": 0,
                "description": "Complete binding count when summary=true; subjects is empty in that mode.",
              },
            "versions":
              {
                "type": "array",
                "items": { "$ref": "#/components/schemas/RoleHistory" },
              },
            "next_version": { "type": "integer", "minimum": 1 },
          },
      }
    MutationResult:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["Changed", "RoleVersion"],
        "properties":
          {
            "Changed": { "type": "boolean" },
            "RoleVersion": { "type": "integer", "minimum": 1 },
          },
      }
    AuditPage:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["items"],
        "properties":
          {
            "items":
              {
                "type": "array",
                "items": { "$ref": "#/components/schemas/AuditEvent" },
              },
            "next_cursor": { "type": "integer", "minimum": 1 },
          },
      }
