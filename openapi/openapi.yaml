openapi: 3.1.0
info:
  title: Amsonia Core API
  version: 0.2.0-preview.1
  description: Tenant administration and delegated authorization API for Amsonia Core.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /
    description: Same-origin deployment
tags:
  - name: Health
    description: Process liveness and database readiness.
  - name: Authentication
    description: Administrator sessions and rotating credentials.
  - name: Tenants
    description: Tenant registry and membership views.
  - name: Authorization
    description: Permission catalog, roles, audit, and policy decisions.
paths:
  /health:
    get:
      summary: Check process liveness
      tags: [Health]
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Process is serving requests.
          content:
            application/json:
              schema:
                type: object
                required: [status, uptime_seconds]
                properties:
                  status: { type: string, const: ok }
                  uptime_seconds: { type: integer, minimum: 0 }
  /readyz:
    get:
      summary: Check database readiness
      tags: [Health]
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Database schema is current and clean.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ready }
        "503":
          description: Database or migration state is not ready.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Error" } },
            }
  /api/v1/auth/login:
    post:
      summary: Sign in an account
      tags: [Authentication]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, format: password, maxLength: 128 }
      responses:
        "200":
          description: Authenticated. Also sets the HttpOnly `amsonia_refresh` cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/refresh:
    post:
      summary: Rotate a session
      tags: [Authentication]
      operationId: refreshSession
      description: Rotates the HttpOnly refresh cookie and returns a new access token. Invalid credentials clear the cookie; service failures preserve it for retry. Reuse of a rotated token revokes all account sessions; an explicitly revoked current token is rejected without revoking other devices.
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Session rotated.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Service failure; refresh cookie is preserved for retry.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Error" } },
            }
  /api/v1/auth/restore:
    post:
      summary: Restore the browser session or return anonymous
      tags: [Authentication]
      operationId: restoreSession
      description: Optional cookie-based startup. A valid HttpOnly refresh cookie is rotated and returns a session. Missing, expired, revoked, or replayed credentials clear the cookie and return 204. Replay detection is identical to refresh. Service failures preserve the cookie for retry.
      security: []
      responses:
        "200":
          description: Session restored and refresh cookie rotated.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "204":
          description: Anonymous browser; no session body. Refresh cookie cleared.
        "500":
          description: Service failure; cookie preserved for retry.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Error" } },
            }
  /api/v1/auth/logout:
    post:
      summary: Revoke a session
      tags: [Authentication]
      operationId: logout
      description: Atomically revokes the device session families identified by supplied access and refresh credentials, including older live access tokens from rotation. Other device families remain active. It is safe to call after access expiry. Failed requests retain the refresh cookie for an explicit retry.
      security:
        - bearerAuth: []
        - refreshCookie: []
      responses:
        "204":
          {
            description: Device session families revoked and refresh cookie cleared.,
          }
        "500":
          description: Logout failed; credentials and cookie are retained for retry.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Error" } },
            }
  /api/v1/auth/me:
    get:
      summary: Read the current account
      tags: [Authentication]
      operationId: getCurrentAccount
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/tenants:
    get:
      summary: List visible tenants
      tags: [Tenants]
      operationId: listTenants
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active tenants visible to the current account.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Provision a tenant
      tags: [Tenants]
      operationId: createTenant
      description: System-administrator-only tenant provisioning.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "201":
          description: Active tenant with the current account as owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/permissions:
    get:
      summary: List the permission catalog
      tags: [Authorization]
      operationId: listPermissions
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Developer-owned immutable permission catalog.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Permission" }
  /api/v1/tenants/{tenant_id}/members:
    get:
      summary: List tenant members
      tags: [Tenants]
      operationId: listTenantMembers
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant memberships.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/tenants/{tenant_id}/roles:
    get:
      summary: List tenant roles
      tags: [Authorization]
      operationId: listRoles
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Active roles ordered by name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Role" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Create a role with initial permissions
      tags: [Authorization]
      operationId: createRole
      description: Atomically creates a role and its tenant-wide initial grants.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, name, description, permissions]
              properties:
                id: { type: string, minLength: 1, maxLength: 128 }
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string, maxLength: 500 }
                permissions:
                  type: array
                  uniqueItems: true
                  items: { type: string }
      responses:
        "201":
          description: Role at immutable version one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/tenants/{tenant_id}/capabilities:
    get:
      summary: Read effective console capabilities
      tags: [Authorization]
      operationId: getTenantCapabilities
      description: Returns server-evaluated tenant permissions for the current account. Clients may use this for presentation; every protected endpoint still performs its own authorization check.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Effective tenant-action permissions used by the Console.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/tenants/{tenant_id}/audit-events:
    {
      "get":
        {
          "operationId": "listAuditEvents",
          "summary": "Search tenant administration audit events",
          "description": "Requires tenant-wide iam:audit:read. Uses descending stable event IDs; next_cursor is exclusive. Text search matches operation, actor, target, reason, or request ID.",
          "tags": ["Tenants"],
          "security": [{ "bearerAuth": [] }],
          "responses":
            {
              "200":
                {
                  "description": "Completed.",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/AuditPage" },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "401": { "$ref": "#/components/responses/Unauthorized" },
              "403": { "$ref": "#/components/responses/Forbidden" },
              "404": { "$ref": "#/components/responses/NotFound" },
              "409": { "$ref": "#/components/responses/Conflict" },
              "429": { "$ref": "#/components/responses/TooManyRequests" },
            },
          "parameters":
            [
              {
                "name": "tenant_id",
                "in": "path",
                "required": true,
                "schema":
                  { "type": "string", "minLength": 1, "maxLength": 256 },
              },
              {
                "name": "limit",
                "in": "query",
                "schema":
                  {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 200,
                    "default": 50,
                  },
              },
              {
                "name": "before",
                "in": "query",
                "schema": { "type": "integer", "minimum": 1 },
              },
              {
                "name": "q",
                "in": "query",
                "schema": { "type": "string", "maxLength": 128 },
              },
              {
                "name": "operation",
                "in": "query",
                "schema": { "type": "string", "maxLength": 64 },
              },
              {
                "name": "outcome",
                "in": "query",
                "schema":
                  {
                    "type": "string",
                    "enum": ["success", "noop", "denied", "conflict", "failed"],
                  },
              },
            ],
        },
    }
  /api/v1/authorization/check:
    post:
      summary: Evaluate an authorization decision
      tags: [Authorization]
      operationId: checkAuthorization
      description: Tenant members may check themselves; system administrators may supply another subject.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthorizationCheck" }
      responses:
        "200":
          description: Explainable authorization decision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/auth/profile:
    {
      "get":
        {
          "operationId": "getProfile",
          "summary": "Read your profile",
          "description": "Read your profile.",
          "tags": ["Authentication"],
          "security": [{ "bearerAuth": [] }],
          "responses":
            {
              "200":
                {
                  "description": "Completed.",
                  "content":
                    {
                      "application/json":
                        {
                          "schema": { "$ref": "#/components/schemas/Profile" },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "401": { "$ref": "#/components/responses/Unauthorized" },
              "403": { "$ref": "#/components/responses/Forbidden" },
              "404": { "$ref": "#/components/responses/NotFound" },
              "409": { "$ref": "#/components/responses/Conflict" },
              "429": { "$ref": "#/components/responses/TooManyRequests" },
            },
        },
      "patch":
        {
          "operationId": "updateProfile",
          "summary": "Update your display name",
          "description": "Update your display name.",
          "tags": ["Authentication"],
          "security": [{ "bearerAuth": [] }],
          "responses":
            {
              "200":
                {
                  "description": "Completed.",
                  "content":
                    {
                      "application/json":
                        {
                          "schema": { "$ref": "#/components/schemas/Profile" },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "401": { "$ref": "#/components/responses/Unauthorized" },
              "403": { "$ref": "#/components/responses/Forbidden" },
              "404": { "$ref": "#/components/responses/NotFound" },
              "409": { "$ref": "#/components/responses/Conflict" },
              "429": { "$ref": "#/components/responses/TooManyRequests" },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "additionalProperties": false,
                          "required": ["display_name"],
                          "properties":
                            {
                              "display_name":
                                { "type": "string", "maxLength": 80 },
                            },
                        },
                    },
                },
            },
        },
    }
  /api/v1/auth/password:
    {
      "post":
        {
          "operationId": "changePassword",
          "summary": "Change password and revoke every session",
          "description": "Verifies the current password with account lockout. Revokes all access and refresh sessions and clears the refresh cookie. Sign in again after success.",
          "tags": ["Authentication"],
          "security": [{ "bearerAuth": [] }],
          "responses":
            {
              "204": { "description": "Completed." },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "401": { "$ref": "#/components/responses/Unauthorized" },
              "403": { "$ref": "#/components/responses/Forbidden" },
              "404": { "$ref": "#/components/responses/NotFound" },
              "409": { "$ref": "#/components/responses/Conflict" },
              "429": { "$ref": "#/components/responses/TooManyRequests" },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "additionalProperties": false,
                          "required": ["current_password", "new_password"],
                          "properties":
                            {
                              "current_password":
                                {
                                  "type": "string",
                                  "format": "password",
                                  "maxLength": 128,
                                },
                              "new_password":
                                {
                                  "type": "string",
                                  "format": "password",
                                  "minLength": 12,
                                  "maxLength": 128,
                                },
                            },
                        },
                    },
                },
            },
        },
    }
  /api/v1/auth/sessions:
    {
      "get":
        {
          "operationId": "listSessions",
          "summary": "List your active device session families",
          "description": "List your active device session families.",
          "tags": ["Authentication"],
          "security": [{ "bearerAuth": [] }],
          "responses":
            {
              "200":
                {
                  "description": "Completed.",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "additionalProperties": false,
                              "required": ["items"],
                              "properties":
                                {
                                  "items":
                                    {
                                      "type": "array",
                                      "items":
                                        {
                                          "$ref": "#/components/schemas/AccountSession",
                                        },
                                    },
                                },
                            },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "401": { "$ref": "#/components/responses/Unauthorized" },
              "403": { "$ref": "#/components/responses/Forbidden" },
              "404": { "$ref": "#/components/responses/NotFound" },
              "409": { "$ref": "#/components/responses/Conflict" },
              "429": { "$ref": "#/components/responses/TooManyRequests" },
            },
        },
    }
  /api/v1/auth/sessions/{session_id}:
    {
      "delete":
        {
          "operationId": "revokeSession",
          "summary": "Revoke your device session family",
          "description": "Revoke your device session family.",
          "tags": ["Authentication"],
          "security": [{ "bearerAuth": [] }],
          "responses":
            {
              "204": { "description": "Completed." },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "401": { "$ref": "#/components/responses/Unauthorized" },
              "403": { "$ref": "#/components/responses/Forbidden" },
              "404": { "$ref": "#/components/responses/NotFound" },
              "409": { "$ref": "#/components/responses/Conflict" },
              "429": { "$ref": "#/components/responses/TooManyRequests" },
            },
          "parameters":
            [
              {
                "name": "session_id",
                "in": "path",
                "required": true,
                "schema":
                  { "type": "string", "minLength": 1, "maxLength": 256 },
              },
            ],
        },
    }
  /api/v1/invitations/preview:
    {
      "post":
        {
          "operationId": "previewInvitation",
          "summary": "Inspect an invitation using its secret token",
          "description": "Inspect an invitation using its secret token.",
          "tags": ["Authentication"],
          "security": [],
          "responses":
            {
              "200":
                {
                  "description": "Completed.",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "$ref": "#/components/schemas/InvitationPreview",
                            },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "404": { "$ref": "#/components/responses/NotFound" },
              "409": { "$ref": "#/components/responses/Conflict" },
              "429": { "$ref": "#/components/responses/TooManyRequests" },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "additionalProperties": false,
                          "required": ["token"],
                          "properties": { "token": { "type": "string" } },
                        },
                    },
                },
            },
        },
    }
  /api/v1/invitations/accept:
    {
      "post":
        {
          "operationId": "acceptInvitation",
          "summary": "Accept an invitation",
          "description": "New accounts choose a 12–128 character password. Existing accounts must prove their current password; it is never reset. Acceptance creates membership without roles and consumes the token. Sign in using the normal login endpoint afterwards.",
          "tags": ["Authentication"],
          "security": [],
          "responses":
            {
              "200":
                {
                  "description": "Completed.",
                  "content":
                    {
                      "application/json":
                        {
                          "schema": { "$ref": "#/components/schemas/Account" },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "404": { "$ref": "#/components/responses/NotFound" },
              "409": { "$ref": "#/components/responses/Conflict" },
              "429": { "$ref": "#/components/responses/TooManyRequests" },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "additionalProperties": false,
                          "required": ["token", "password"],
                          "properties":
                            {
                              "token": { "type": "string" },
                              "password":
                                {
                                  "type": "string",
                                  "format": "password",
                                  "maxLength": 128,
                                },
                            },
                        },
                    },
                },
            },
        },
    }
  /api/v1/tenants/{tenant_id}/invitations:
    {
      "get":
        {
          "operationId": "listInvitations",
          "summary": "List latest 200 tenant invitations",
          "description": "Requires tenant-wide iam:member:manage.",
          "tags": ["Tenants"],
          "security": [{ "bearerAuth": [] }],
          "responses":
            {
              "200":
                {
                  "description": "Completed.",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "additionalProperties": false,
                              "required": ["items"],
                              "properties":
                                {
                                  "items":
                                    {
                                      "type": "array",
                                      "items":
                                        {
                                          "$ref": "#/components/schemas/Invitation",
                                        },
                                    },
                                },
                            },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "401": { "$ref": "#/components/responses/Unauthorized" },
              "403": { "$ref": "#/components/responses/Forbidden" },
              "404": { "$ref": "#/components/responses/NotFound" },
              "409": { "$ref": "#/components/responses/Conflict" },
              "429": { "$ref": "#/components/responses/TooManyRequests" },
            },
          "parameters":
            [
              {
                "name": "tenant_id",
                "in": "path",
                "required": true,
                "schema":
                  { "type": "string", "minLength": 1, "maxLength": 256 },
              },
            ],
        },
      "post":
        {
          "operationId": "createInvitation",
          "summary": "Create a seven-day invitation",
          "description": "Requires tenant-wide iam:member:manage. Reissuing revokes earlier pending links. Returns the secret only once; no email is sent.",
          "tags": ["Tenants"],
          "security": [{ "bearerAuth": [] }],
          "responses":
            {
              "201":
                {
                  "description": "Completed.",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "$ref": "#/components/schemas/CreatedInvitation",
                            },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "401": { "$ref": "#/components/responses/Unauthorized" },
              "403": { "$ref": "#/components/responses/Forbidden" },
              "404": { "$ref": "#/components/responses/NotFound" },
              "409": { "$ref": "#/components/responses/Conflict" },
              "429": { "$ref": "#/components/responses/TooManyRequests" },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "additionalProperties": false,
                          "required": ["email"],
                          "properties":
                            {
                              "email":
                                {
                                  "type": "string",
                                  "format": "email",
                                  "maxLength": 254,
                                },
                            },
                        },
                    },
                },
            },
          "parameters":
            [
              {
                "name": "tenant_id",
                "in": "path",
                "required": true,
                "schema":
                  { "type": "string", "minLength": 1, "maxLength": 256 },
              },
            ],
        },
    }
  /api/v1/tenants/{tenant_id}/invitations/{invitation_id}:
    {
      "delete":
        {
          "operationId": "revokeInvitation",
          "summary": "Revoke a pending invitation",
