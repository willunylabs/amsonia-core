components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    refreshCookie:
      type: apiKey
      in: cookie
      name: amsonia_refresh
  parameters:
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
  responses:
    BadRequest:
      description: Invalid input.
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Authentication or session is invalid.
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: The current account lacks required authority.
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Resource is missing or intentionally hidden.
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Version or uniqueness conflict.
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TooManyRequests:
      description: Login is temporarily locked.
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Account:
      type: object
      required: [id, email, system_admin, created_at]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        system_admin: { type: boolean }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }
    Session:
      type: object
      required: [access_token, expires_at, account]
      properties:
        access_token: { type: string, pattern: "^as_" }
        expires_at: { type: string, format: date-time }
        account: { $ref: "#/components/schemas/Account" }
    Tenant:
      type: object
      required: [id, name, state, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        state: { type: string, enum: [pending, active, failed] }
        created_at: { type: string, format: date-time }
    Member:
      type: object
      required: [account_id, email, status, joined_at]
      properties:
        account_id: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [active, suspended] }
        joined_at: { type: string, format: date-time }
    Permission:
      type: object
      required: [key, description]
      properties:
        key: { type: string }
        description: { type: string }
    Capabilities:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: object
          additionalProperties: { type: boolean }
    Role:
      type: object
      required: [tenant_id, role_id, name, description, version]
      properties:
        tenant_id: { type: string }
        role_id: { type: string }
        name: { type: string }
        description: { type: string }
        version: { type: integer, minimum: 1 }
        deleted: { type: boolean }
    AuditEvent:
      type: object
      required:
        [id, tenant_id, operation, phase, target_type, target_id, outcome, at]
      properties:
        id: { type: integer, minimum: 1 }
        host_initiator: { type: string }
        tenant_id: { type: string }
        actor_subject_id: { type: string }
        operation: { type: string }
        phase: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        outcome: { type: string }
        reason_code: { type: string }
        request_id: { type: string }
        role_version: { type: integer }
        at: { type: string, format: date-time }
    ResourceContext:
      type: object
      additionalProperties: false
      properties:
        tenant_id: { type: string }
        resource_id: { type: string }
        owner_subject_id: { type: string }
        workspace_id: { type: string }
    AuthorizationCheck:
      type: object
      additionalProperties: false
      required: [tenant_id, permission, mode, resource]
      properties:
        tenant_id: { type: string }
        subject_id:
          { type: string, description: Defaults to the current account. }
        permission: { type: string }
        mode: { type: string, enum: [existing, create, tenant_action] }
        resource: { $ref: "#/components/schemas/ResourceContext" }
    Decision:
      type: object
      required: [allowed, reason]
      properties:
        allowed: { type: boolean }
        reason: { type: string }
        effective_scope: { type: string, enum: [own, workspace, tenant] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    Profile:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["id", "email", "display_name", "created_at"],
        "properties":
          {
            "id": { "type": "string" },
