openapi: 3.1.0
info:
  title: Amsonia Core API
  version: 0.2.0-preview.3
  description: Organization administration and delegated authorization API. Standalone deployments default to one organization; multi-tenancy is opt in. In single mode, other tenant IDs and their invitation links return 404; membership and permission checks still apply.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /
    description: Same-origin deployment
tags:
  - name: Health
    description: Process liveness and database readiness.
  - name: Authentication
    description: Administrator sessions and rotating credentials.
  - name: Tenants
    description: Tenant registry and membership views.
  - name: Authorization
    description: Permission catalog, roles, audit, and policy decisions.
paths:
  /health:
    get:
      summary: Check process liveness
      tags: [Health]
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Process is serving requests.
          content:
            application/json:
              schema:
                type: object
                required: [status, uptime_seconds]
                properties:
                  status: { type: string, const: ok }
                  uptime_seconds: { type: integer, minimum: 0 }
  /readyz:
    get:
      summary: Check database readiness
      tags: [Health]
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Database schema is current and clean.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ready }
        "503":
          description: Database or migration state is not ready.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Error" } },
            }
  /api/v1/application:
    get:
      summary: Read the deployment organization model
      tags: [Tenants]
      operationId: getApplication
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Authenticated deployment configuration used by the Console.
          content:
            application/json:
              schema:
                type: object
                required: [tenancy_mode]
                properties:
                  tenancy_mode: { type: string, enum: [single, multi] }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/login:
    post:
      summary: Sign in an account
      tags: [Authentication]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, format: password, maxLength: 128 }
      responses:
        "200":
          description: Authenticated. Also sets the HttpOnly `amsonia_refresh` cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/refresh:
    post:
      summary: Rotate a session
      tags: [Authentication]
      operationId: refreshSession
      description: Rotates the HttpOnly refresh cookie and returns a new access token. Invalid credentials clear the cookie; service failures preserve it for retry. Reuse of a rotated token revokes all account sessions; an explicitly revoked current token is rejected without revoking other devices.
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Session rotated.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Service failure; refresh cookie is preserved for retry.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Error" } },
            }
  /api/v1/auth/restore:
    post:
      summary: Restore the browser session or return anonymous
      tags: [Authentication]
      operationId: restoreSession
      description: Optional cookie-based startup. A valid HttpOnly refresh cookie is rotated and returns a session. Missing, expired, revoked, or replayed credentials clear the cookie and return 204. Replay detection is identical to refresh. Service failures preserve the cookie for retry.
      security: []
      responses:
        "200":
          description: Session restored and refresh cookie rotated.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "204":
          description: Anonymous browser; no session body. Refresh cookie cleared.
        "500":
          description: Service failure; cookie preserved for retry.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Error" } },
            }
  /api/v1/auth/logout:
    post:
      summary: Revoke a session
      tags: [Authentication]
      operationId: logout
      description: Atomically revokes the device session families identified by supplied access and refresh credentials, including older live access tokens from rotation. Other device families remain active. It is safe to call after access expiry. Failed requests retain the refresh cookie for an explicit retry.
      security:
        - bearerAuth: []
        - refreshCookie: []
      responses:
        "204":
          {
            description: Device session families revoked and refresh cookie cleared.,
          }
        "500":
          description: Logout failed; credentials and cookie are retained for retry.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Error" } },
            }
  /api/v1/auth/me:
    get:
      summary: Read the current account
      tags: [Authentication]
      operationId: getCurrentAccount
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/tenants/{tenant_id}/settings:
    get:
      summary: Read organization identity and settings
      operationId: getOrganizationSettings
      tags: [Tenants]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      description: Requires active membership. Single mode also enforces the configured organization. can_manage indicates current system administrator status.
      responses:
        "200":
          description: Current organization settings and edit capability.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update the organization name
      operationId: updateOrganizationSettings
      tags: [Tenants]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      description: Requires an active system administrator with active membership in the selected organization. Compares settings version and commits name and audit atomically. Unchanged names emit noop without advancing version. A conflict requires fetching current settings and deliberate resubmission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, expected_version]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                  description: Trimmed, nonempty UTF-8 name of at most 80 bytes, without control characters.
                expected_version: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Saved organization settings, including current version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/tenants:
    get:
      summary: List visible tenants
      tags: [Tenants]
      operationId: listTenants
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active tenants visible to the current account. Single mode returns only the configured organization, and still requires membership.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Provision a tenant
      tags: [Tenants]
      operationId: createTenant
      description: System-administrator-only tenant provisioning, available only in multi mode. Single mode returns 403.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "201":
          description: Active tenant with the current account as owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/permissions:
    get:
      summary: List the permission catalog
      tags: [Authorization]
      operationId: listPermissions
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Developer-owned immutable permission catalog.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Permission" }
  /api/v1/tenants/{tenant_id}/members:
    get:
      summary: Search and page tenant members
      tags:
        - Tenants
      operationId: listTenantMembers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/DirectoryQuery"
        - $ref: "#/components/parameters/DirectoryLimit"
        - $ref: "#/components/parameters/DirectoryAfter"
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - suspended
      responses:
        "200":
          description: A bounded collection page.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Member"
                  total:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Total matching rows before applying the cursor, in the same request snapshot.
                  next_cursor:
                    type: string
                    maxLength: 8192
                    description: Pass unchanged as after with the same search and status. Absent at the end.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      description: >-
        Requires tenant-wide iam:member:read. Returns 30 items by default (maximum 100), a filtered
        total and an exclusive next_cursor. Search is a case-insensitive literal substring. Ordered by
        immutable ID ascending. Cursors are bound to tenant, collection and filters; pages are live
        snapshots, not a historical export.
  /api/v1/tenants/{tenant_id}/roles:
    get:
      summary: Search and page tenant roles
      tags:
        - Authorization
      operationId: listRoles
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/DirectoryQuery"
        - $ref: "#/components/parameters/DirectoryLimit"
        - $ref: "#/components/parameters/DirectoryAfter"
      responses:
        "200":
          description: A bounded collection page.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
                  total:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Total matching rows before applying the cursor, in the same request snapshot.
                  next_cursor:
                    type: string
                    maxLength: 8192
                    description: Pass unchanged as after with the same search and status. Absent at the end.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      description: >-
        Requires tenant-wide iam:role:read. Returns 30 items by default (maximum 100), a filtered
        total and an exclusive next_cursor. Search is a case-insensitive literal substring. Ordered by
        immutable ID ascending. Cursors are bound to tenant, collection and filters; pages are live
        snapshots, not a historical export.
    post:
      summary: Create a role with initial permissions
      tags:
        - Authorization
      operationId: createRole
      description: Atomically creates a role and its tenant-wide initial grants.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - id
                - name
                - description
                - permissions
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 128
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                description:
                  type: string
                  maxLength: 500
                permissions:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
      responses:
        "201":
          description: Role at immutable version one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/tenants/{tenant_id}/capabilities:
    get:
      summary: Read effective console capabilities
      tags: [Authorization]
      operationId: getTenantCapabilities
      description: Returns server-evaluated tenant permissions for the current account. Clients may use this for presentation; every protected endpoint still performs its own authorization check.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Effective tenant-action permissions used by the Console.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/tenants/{tenant_id}/audit-events:
    get:
      operationId: listAuditEvents
      summary: Search tenant administration audit events
      description: >-
        Requires tenant-wide iam:audit:read. Uses descending stable event IDs; next_cursor is
        exclusive. Text search matches operation, actor, target, reason, or request ID. Optional
        RFC3339 from (inclusive) and until (exclusive) timestamps require an explicit UTC offset or Z;
        from must precede until. Each page uses its own read-only snapshot.
      tags:
        - Tenants
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: before
          in: query
          schema:
            type: integer
            minimum: 1
        - name: q
          in: query
          schema:
            type: string
            maxLength: 128
        - name: operation
          in: query
          schema:
            type: string
            maxLength: 64
        - name: outcome
          in: query
          schema:
            type: string
            enum:
              - success
              - noop
              - denied
              - conflict
              - failed
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditUntil'
  /api/v1/tenants/{tenant_id}/audit-events/export:
    get:
      operationId: exportAuditEvents
      summary: Download all matching tenant audit events as CSV
      description: >-
        Requires tenant-wide iam:audit:read. Uses the same filters as listAuditEvents in one read-only
        tenant snapshot, ordered by descending event ID. Rejects before and limit parameters. UTF-8
        with BOM, fixed header and RFC3339 UTC timestamps; formula/control-leading text cells receive
        a leading tab. Empty results contain the header. The complete response is buffered before
        sending headers: more than 10,000 events or 10 MiB returns JSON 422 with code
        audit_export_too_large, never partial CSV. Cache-Control is no-store.
      tags:
        - Tenants
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: q
          in: query
          schema:
            type: string
            maxLength: 128
        - name: operation
          in: query
          schema:
            type: string
            maxLength: 64
        - name: outcome
          in: query
          schema:
            type: string
            enum:
              - success
              - noop
              - denied
              - conflict
              - failed
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditUntil'
      responses:
        '200':
          description: Complete matching event snapshot.
          headers:
            Content-Disposition:
              description: Attachment with a server-generated ASCII .csv filename.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: >-
            Export exceeds 10,000 matching events or 10 MiB. Narrow the date range or filters. Error
            code: audit_export_too_large.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/authorization/check:
    post:
      summary: Evaluate an authorization decision
      tags: [Authorization]
      operationId: checkAuthorization
      description: Tenant members may check themselves; system administrators may supply another subject.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthorizationCheck" }
      responses:
        "200":
          description: Explainable authorization decision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/auth/profile:
    {
      "get":
        {
          "operationId": "getProfile",
          "summary": "Read your profile",
          "description": "Read your profile.",
          "tags": ["Authentication"],
          "security": [{ "bearerAuth": [] }],
          "responses":
            {
              "200":
                {
                  "description": "Completed.",
                  "content":
                    {
                      "application/json":
                        {
                          "schema": { "$ref": "#/components/schemas/Profile" },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "401": { "$ref": "#/components/responses/Unauthorized" },
              "403": { "$ref": "#/components/responses/Forbidden" },
              "404": { "$ref": "#/components/responses/NotFound" },
              "409": { "$ref": "#/components/responses/Conflict" },
              "429": { "$ref": "#/components/responses/TooManyRequests" },
            },
        },
      "patch":
        {
          "operationId": "updateProfile",
          "summary": "Update your display name",
          "description": "Update your display name.",
          "tags": ["Authentication"],
          "security": [{ "bearerAuth": [] }],
          "responses":
            {
              "200":
                {
                  "description": "Completed.",
                  "content":
                    {
                      "application/json":
                        {
                          "schema": { "$ref": "#/components/schemas/Profile" },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "401": { "$ref": "#/components/responses/Unauthorized" },
              "403": { "$ref": "#/components/responses/Forbidden" },
              "404": { "$ref": "#/components/responses/NotFound" },
              "409": { "$ref": "#/components/responses/Conflict" },
              "429": { "$ref": "#/components/responses/TooManyRequests" },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "additionalProperties": false,
                          "required": ["display_name"],
                          "properties":
                            {
                              "display_name":
                                { "type": "string", "maxLength": 80 },
                            },
                        },
                    },
                },
            },
        },
    }
  /api/v1/auth/password:
    {
      "post":
        {
          "operationId": "changePassword",
          "summary": "Change password and revoke every session",
          "description": "Verifies the current password with account lockout. Revokes all access and refresh sessions and clears the refresh cookie. Sign in again after success.",
          "tags": ["Authentication"],
          "security": [{ "bearerAuth": [] }],
          "responses":
            {
              "204": { "description": "Completed." },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "401": { "$ref": "#/components/responses/Unauthorized" },
              "403": { "$ref": "#/components/responses/Forbidden" },
              "404": { "$ref": "#/components/responses/NotFound" },
              "409": { "$ref": "#/components/responses/Conflict" },
              "429": { "$ref": "#/components/responses/TooManyRequests" },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "additionalProperties": false,
                          "required": ["current_password", "new_password"],
                          "properties":
                            {
                              "current_password":
                                {
                                  "type": "string",
                                  "format": "password",
                                  "maxLength": 128,
                                },
                              "new_password":
                                {
                                  "type": "string",
                                  "format": "password",
                                  "minLength": 12,
                                  "maxLength": 128,
                                },
                            },
                        },
                    },
                },
            },
        },
    }
  /api/v1/auth/sessions:
    {
      "get":
        {
          "operationId": "listSessions",
          "summary": "List your active device session families",
          "description": "List your active device session families.",
          "tags": ["Authentication"],
          "security": [{ "bearerAuth": [] }],
          "responses":
            {
              "200":
                {
                  "description": "Completed.",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "additionalProperties": false,
                              "required": ["items"],
                              "properties":
                                {
                                  "items":
                                    {
                                      "type": "array",
                                      "items":
                                        {
                                          "$ref": "#/components/schemas/AccountSession",
                                        },
                                    },
                                },
                            },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "401": { "$ref": "#/components/responses/Unauthorized" },
              "403": { "$ref": "#/components/responses/Forbidden" },
              "404": { "$ref": "#/components/responses/NotFound" },
              "409": { "$ref": "#/components/responses/Conflict" },
              "429": { "$ref": "#/components/responses/TooManyRequests" },
            },
        },
    }
  /api/v1/auth/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      summary: Sign out your other device session families
      description: >-
        Atomically revokes access and refresh tokens for every other device family
        on the authenticated account, across all tenants. The retained family is
        derived from the live bearer token after locking the account. No account
        or session ID is accepted. Repeating the action is safe; the current
        family and refresh cookie remain unchanged. Future password sign-ins are
        allowed. Concurrent refresh cannot restore a revoked family. Reuse of a
        previously rotated refresh token retains the existing account-wide replay
        response. Existing per-device revocation and list contracts are unchanged.
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
