  /api/v1/tenants/{tenant_id}/invitations:
    get:
      operationId: listInvitations
      summary: Search and page tenant invitations
      description: >-
        Requires tenant-wide iam:member:manage. Returns 30 items by default (maximum 100), a filtered
        total and an exclusive next_cursor. Search is a case-insensitive literal substring. Ordered by
        created_at then invitation ID, both descending. Cursors are bound to tenant, collection and
        filters; pages are live snapshots, not a historical export.
      tags:
        - Tenants
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A bounded collection page.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                  - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invitation"
                  total:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Total matching rows before applying the cursor, in the same request snapshot.
                  next_cursor:
                    type: string
                    maxLength: 8192
                    description: Pass unchanged as after with the same search and status. Absent at the end.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/DirectoryQuery"
        - $ref: "#/components/parameters/DirectoryLimit"
        - $ref: "#/components/parameters/DirectoryAfter"
        - name: status
          in: query
          schema:
            type: string
            enum:
              - pending
              - accepted
              - revoked
              - expired
    post:
      operationId: createInvitation
      summary: Create a seven-day invitation
      description: >-
        Requires tenant-wide iam:member:manage. Reissuing revokes earlier pending links. Returns the
        secret only once; no email is sent.
      tags:
        - Tenants
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
