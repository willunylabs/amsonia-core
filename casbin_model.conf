# RBAC bindings are resolved by the tenant-scoped PolicyReader. Each check
# supplies one validated effective grant as an ABAC attribute; the enforcer
# holds no mutable tenant policy or cached authorization decisions.
[request_definition]
r = request, grant
r2 = request, grant

[policy_definition]
p = unused

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
# Resource access: an exact permission, the same tenant, and a matching scope.
m = r.request.Permission == r.grant.Permission && \
    (r.request.ResourceTenantID == "" || r.request.ResourceTenantID == r.request.TenantID) && \
    (r.grant.Scope == "tenant" || \
      (r.request.Mode != "tenant_action" && \
        ((r.grant.Scope == "own" && r.request.OwnerSubjectID != "" && r.request.OwnerSubjectID == r.request.SubjectID) || \
         (r.grant.Scope == "workspace" && r.request.WorkspaceID != "" && r.request.WorkspaceMember && workspaceRoleMatch(r.request.WorkspaceRole, r.grant.WorkspaceRoles)))))

# Delegation: administrative controls require an exact scope; delegating a
# grant may also use tenant scope. Workspace constraints must cover the target.
m2 = r2.request.Permission == r2.grant.Permission && \
     (r2.grant.Scope == r2.request.Scope || (!r2.request.ExactScope && r2.grant.Scope == "tenant")) && \
     workspaceRolesCover(r2.grant.WorkspaceRoles, r2.request.WorkspaceRoles)
