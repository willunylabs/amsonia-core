http:
  middlewares:
    amsonia-site-security:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        stsSeconds: 31536000
        stsIncludeSubdomains: true
    amsonia-demo-retired-security:
      headers:
        customResponseHeaders:
          X-Robots-Tag: noindex
    amsonia-demo-commercial-redirect:
      redirectRegex:
        regex: ^https?://demo\.amsonia\.dev/.*$
        replacement: https://willuny.com/admin/login
        permanent: false
    amsonia-origin-https:
      redirectScheme:
        scheme: https
        permanent: true

  routers:
    amsonia-demo-retired:
      entryPoints:
        - websecure
      rule: Host(`demo.amsonia.dev`)
      middlewares:
        - amsonia-demo-retired-security
        - amsonia-demo-commercial-redirect
      service: noop@internal
      tls:
        certResolver: letsencrypt

    amsonia-demo-retired-http:
      entryPoints:
        - web
      rule: Host(`demo.amsonia.dev`)
      middlewares:
        - amsonia-demo-retired-security
        - amsonia-demo-commercial-redirect
      service: noop@internal

    amsonia-site:
      entryPoints:
        - websecure
      rule: Host(`amsonia.dev`)
      middlewares:
        - amsonia-site-security
      service: amsonia-site
      tls:
        certResolver: letsencrypt

    amsonia-site-http:
      entryPoints:
        - web
      rule: Host(`amsonia.dev`)
      middlewares:
        - amsonia-origin-https
      service: noop@internal

  services:
    amsonia-site:
      loadBalancer:
        passHostHeader: true
        healthCheck:
          path: /healthz
          interval: 10s
          timeout: 3s
        servers:
          - url: http://127.0.0.1:8084
