name: Deploy Amsonia Site

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-amsonia-site-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: amsonia-production
    timeout-minutes: 20
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.AMSONIA_EC2_INSTANCE_ID }}
      ARTIFACT_BUCKET: ${{ vars.AMSONIA_ARTIFACT_BUCKET }}
      ARTIFACT_PREFIX: ${{ vars.AMSONIA_ARTIFACT_PREFIX }}
      PUBLIC_SITE_ORIGIN: ${{ vars.PUBLIC_SITE_ORIGIN }}
      PUBLIC_COMPANY_ORIGIN: ${{ vars.PUBLIC_COMPANY_ORIGIN }}
      PUBLIC_GITHUB_URL: ${{ vars.PUBLIC_GITHUB_URL }}
      PUBLIC_COMMERCIAL_URL: ${{ vars.PUBLIC_COMMERCIAL_URL }}
      PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}

    steps:
      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test -n "${AWS_REGION}"
          test -n "${INSTANCE_ID}"
          test -n "${ARTIFACT_BUCKET}"
          test -n "${ARTIFACT_PREFIX}"
          test -n "${PUBLIC_SITE_ORIGIN}"
          test -n "${PUBLIC_COMPANY_ORIGIN}"
          test -n "${PUBLIC_GITHUB_URL}"
          test -n "${PUBLIC_COMMERCIAL_URL}"
          test -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true

      - name: Build and validate product site
        working-directory: site
        run: |
          npm ci
          npm run check

      - name: Build static server
        run: |
          set -euo pipefail
          mkdir -p release/site
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags='-s -w' -o release/amsonia-static ./cmd/amsonia-static
          cp -a site/dist/. release/site/
          test -x release/amsonia-static
          test -s release/site/index.html
          test -s release/site/robots.txt
          test -s release/site/sitemap.xml

      - name: Package immutable release
        id: artifact
        run: |
          set -euo pipefail
          artifact_name="amsonia-site-${RELEASE_SHA}.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C release -czf "${artifact_name}" amsonia-static site
          artifact_sha256="$(sha256sum "${artifact_name}" | awk '{print $1}')"
          artifact_key="${ARTIFACT_PREFIX}/${RELEASE_SHA}/${artifact_name}"
          artifact_uri="s3://${ARTIFACT_BUCKET}/${artifact_key}"
          echo "name=${artifact_name}" >>"${GITHUB_OUTPUT}"
          echo "sha256=${artifact_sha256}" >>"${GITHUB_OUTPUT}"
          echo "key=${artifact_key}" >>"${GITHUB_OUTPUT}"
          echo "uri=${artifact_uri}" >>"${GITHUB_OUTPUT}"

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: amsonia-site-${{ github.run_id }}

      - name: Upload versioned artifact
        run: |
          aws s3 cp "${{ steps.artifact.outputs.name }}" "${{ steps.artifact.outputs.uri }}" \
            --only-show-errors

      - name: Deploy through constrained SSM document
        id: deploy
        run: |
          set -euo pipefail
          parameters="$(jq -cn \
            --arg uri "${{ steps.artifact.outputs.uri }}" \
            --arg release "${RELEASE_SHA}" \
            --arg digest "${{ steps.artifact.outputs.sha256 }}" \
            '{ArtifactUri:[$uri],ReleaseSha:[$release],ArtifactSha256:[$digest]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AmsoniaDeploySite \
            --parameters "${parameters}" \
            --comment "Deploy Amsonia site ${RELEASE_SHA}" \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=${command_id}" >>"${GITHUB_OUTPUT}"

          for attempt in {1..60}; do
            status="$(aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${INSTANCE_ID}" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "${status}" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "${command_id}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query '{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode,StandardErrorContent:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac
            if [[ "${attempt}" -eq 60 ]]; then
              echo "SSM deployment did not finish within five minutes" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Verify public Amsonia site
        run: |
          set -euo pipefail
          for route in / /platform /next /robots.txt /sitemap.xml; do
            test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --retry 10 --retry-all-errors --retry-delay 2 "${PUBLIC_SITE_ORIGIN}${route}")" = 200
          done
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --retry 10 --retry-all-errors --retry-delay 2 "${PUBLIC_SITE_ORIGIN}/core")" = 301
          for route in /api/example /deployment-probe-not-found; do
            test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --retry 10 --retry-all-errors --retry-delay 2 "${PUBLIC_SITE_ORIGIN}${route}")" = 404
          done
