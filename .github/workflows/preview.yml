name: Preview bundle

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
      - name: Build pinned image bundle
        run: scripts/build-preview.sh "$RUNNER_TEMP/preview"
      - name: Prepare Chromium for browser verification
        timeout-minutes: 6
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "60000"
        run: |
          npm install --prefix "$RUNNER_TEMP/preview-browser" --no-save --no-package-lock --fetch-retries=2 --fetch-timeout=60000 playwright@1.58.2
          "$RUNNER_TEMP/preview-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Install and verify archive
        run: |
          cd "$RUNNER_TEMP/preview"
          sha256sum --check SHA256SUMS
          tar -xzf amsonia-core-*-linux-amd64.tar.gz
          python3 -B "$GITHUB_WORKSPACE/scripts/smoke-preview.py" amsonia-core-*-linux-amd64 \
            --browser-module "$RUNNER_TEMP/preview-browser/node_modules/playwright" \
            --screenshots "$RUNNER_TEMP/preview/screenshots"
      - name: Verify backup and upgrade from preview.3
        run: |
          bash scripts/download-public-preview.sh v0.2.0-preview.3 "$RUNNER_TEMP/old-preview"
          mkdir -p "$RUNNER_TEMP/preview-upgrade"
          tar -xzf "$RUNNER_TEMP"/preview/amsonia-core-*-linux-amd64.tar.gz -C "$RUNNER_TEMP/preview-upgrade"
          python3 -B scripts/smoke-preview-upgrade.py \
            "$RUNNER_TEMP/old-preview/amsonia-core-0.2.0-preview.3-linux-amd64" \
            "$RUNNER_TEMP"/preview-upgrade/amsonia-core-*-linux-amd64 \
            "$RUNNER_TEMP/preview-browser/node_modules/playwright" \
            "$RUNNER_TEMP/preview/screenshots-upgrade"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: preview-first-login
          path: |
            ${{ runner.temp }}/preview/screenshots/*.png
            ${{ runner.temp }}/preview/screenshots-upgrade/*.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: amsonia-preview-linux-amd64
          path: |
            ${{ runner.temp }}/preview/*.tar.gz
            ${{ runner.temp }}/preview/SHA256SUMS
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
