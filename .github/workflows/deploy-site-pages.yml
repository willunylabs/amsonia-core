name: Deploy Amsonia Site to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: true
        default: "main"

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-amsonia-site-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: amsonia-production
    timeout-minutes: 20
    env:
      PUBLIC_SITE_ORIGIN: ${{ vars.PUBLIC_SITE_ORIGIN }}
      PUBLIC_COMPANY_ORIGIN: ${{ vars.PUBLIC_COMPANY_ORIGIN }}
      PUBLIC_GITHUB_URL: ${{ vars.PUBLIC_GITHUB_URL }}
      PUBLIC_COMMERCIAL_URL: ${{ vars.PUBLIC_COMMERCIAL_URL }}
      PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.AMSONIA_CLOUDFLARE_PAGES_PROJECT }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Validate Pages deployment configuration
        run: |
          set -euo pipefail
          test -n "${PUBLIC_SITE_ORIGIN}"
          test -n "${PUBLIC_COMPANY_ORIGIN}"
          test -n "${PUBLIC_GITHUB_URL}"
          test -n "${PUBLIC_COMMERCIAL_URL}"
          test -n "${CLOUDFLARE_PAGES_PROJECT}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${CLOUDFLARE_API_TOKEN}"

      - name: Build and validate product site
        working-directory: site
        run: |
          npm ci
          npm run check

      - name: Deploy immutable build to Pages
        id: deploy
        working-directory: site
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          [[ "${release_sha}" =~ ^[0-9a-f]{40}$ ]]
          npx --yes wrangler@4.84.1 pages deploy dist \
            --project-name "${CLOUDFLARE_PAGES_PROJECT}" \
            --branch main \
            --commit-hash "${release_sha}" \
            --commit-message "Amsonia site ${release_sha}"
          echo "release_sha=${release_sha}" >>"${GITHUB_OUTPUT}"

      - name: Verify Pages shadow deployment
        run: |
          set -euo pipefail
          pages_origin="https://${CLOUDFLARE_PAGES_PROJECT}.pages.dev"
          for route in / /core /core/docs/getting-started /robots.txt /sitemap.xml; do
            test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --retry 10 --retry-all-errors --retry-delay 2 "${pages_origin}${route}")" = 200
          done
          for route in /api/example /deployment-probe-not-found; do
            test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --retry 10 --retry-all-errors --retry-delay 2 "${pages_origin}${route}")" = 404
          done

      - name: Deployment summary
        run: |
          {
            echo "## Amsonia Pages shadow deployment"
            echo "- release: \`${{ steps.deploy.outputs.release_sha }}\`"
            echo "- project: \`${CLOUDFLARE_PAGES_PROJECT}\`"
            echo "- URL: \`https://${CLOUDFLARE_PAGES_PROJECT}.pages.dev\`"
            echo "- custom domain: unchanged"
          } >>"${GITHUB_STEP_SUMMARY}"
