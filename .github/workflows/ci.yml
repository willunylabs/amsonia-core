name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true
      - name: Verify exported source provenance
        run: |
          go run ./cmd/core-sync --mode verify --destination-root . --provenance provenance/willuny-go-admin.json
          go run ./cmd/core-sync --mode verify --destination-root . --provenance provenance/willuny-go-ui.json
      - name: Format check
        run: |
          test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Reachable vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Compose quickstart configuration
        run: docker compose --env-file .env.example --file compose.yaml --file compose.local.yaml config --quiet

  web:
    runs-on: ubuntu-latest
    env:
      VITE_GITHUB_URL: https://source.example.test/project
      VITE_COMMERCIAL_URL: https://company.example.test/product
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: OpenAPI contract
        working-directory: ${{ github.workspace }}
        run: npx --yes @redocly/cli@2.46.1 lint openapi/openapi.yaml

  site:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_ORIGIN: https://product.example.test
      PUBLIC_COMPANY_ORIGIN: https://company.example.test
      PUBLIC_GITHUB_URL: https://source.example.test/project
      PUBLIC_DEMO_ORIGIN: https://demo.example.test
      PUBLIC_COMMERCIAL_URL: https://company.example.test/product
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - run: npm run check

  deployment-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate host deployment script
        run: |
          test -x deploy/demo/deploy-amsonia-site.sh
          test -x deploy/demo/deploy-amsonia-demo-web.sh
          bash -n deploy/demo/deploy-amsonia-site.sh
          bash -n deploy/demo/deploy-amsonia-demo-web.sh
      - name: Validate constrained AWS deployment contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          aws_root = Path("deploy/aws")
          site_document = json.loads((aws_root / "amsonia-deploy-site-document.json").read_text())
          demo_document = json.loads((aws_root / "amsonia-deploy-demo-web-document.json").read_text())
          trust = json.loads((aws_root / "amsonia-github-deploy-trust.json").read_text())
          policy = json.loads((aws_root / "amsonia-github-deploy-policy.json").read_text())

          site_command = site_document["mainSteps"][0]["inputs"]["runCommand"]
          assert site_command == [
              "/usr/local/sbin/deploy-amsonia-site "
              "'{{ ArtifactUri }}' '{{ ReleaseSha }}' '{{ ArtifactSha256 }}'"
          ]
          demo_command = demo_document["mainSteps"][0]["inputs"]["runCommand"]
          assert demo_command == [
              "/usr/local/sbin/deploy-amsonia-demo-web "
              "'{{ ArtifactUri }}' '{{ ReleaseSha }}' '{{ ArtifactSha256 }}'"
          ]

          conditions = trust["Statement"][0]["Condition"]["StringEquals"]
          assert conditions["token.actions.githubusercontent.com:aud"] == "sts.amazonaws.com"
          assert conditions["token.actions.githubusercontent.com:sub"] == (
              "repo:willunylabs@252529865/amsonia-core@1322524885:"
              "environment:amsonia-production"
          )

          send_statement = next(
              item for item in policy["Statement"]
              if item["Sid"] == "RunFixedSiteDeploymentDocument"
          )
          assert set(send_statement["Resource"]) == {
              "arn:aws:ssm:us-east-1:336090301244:document/AmsoniaDeploySite",
              "arn:aws:ec2:us-east-1:336090301244:instance/i-00e3d5d4c5c6b0dac",
          }
          demo_send_statement = next(
              item for item in policy["Statement"]
              if item["Sid"] == "RunFixedDemoWebDeploymentDocument"
          )
          assert set(demo_send_statement["Resource"]) == {
              "arn:aws:ssm:us-east-1:336090301244:document/AmsoniaDeployDemoWeb",
              "arn:aws:ec2:us-east-1:336090301244:instance/i-00e3d5d4c5c6b0dac",
          }
          demo_artifact_statement = next(
              item for item in policy["Statement"]
              if item["Sid"] == "PublishVersionedDemoWebArtifact"
          )
          assert demo_artifact_statement["Resource"] == (
              "arn:aws:s3:::h1-recon-results-336090301244-us-east-1/"
              "deployments/amsonia/demo-web/*"
          )
          assert "AWS-RunShellScript" not in json.dumps(policy)
          PY

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amsonia_admin
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: amsonia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amsonia_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true
      - name: Integration tests (PostgreSQL)
        env:
          TEST_DATABASE_ADMIN_URL: "postgres://amsonia_admin:test-only@localhost:5432/amsonia_test?sslmode=disable"
        run: go test -tags postgres -count=1 ./postgres/
