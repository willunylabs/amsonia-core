name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.12"
          cache: true
      - name: Verify exported source provenance
        run: |
          go run ./cmd/core-sync --mode verify --destination-root . --provenance provenance/willuny-go-admin.json
          go run ./cmd/core-sync --mode verify --destination-root . --provenance provenance/willuny-go-ui.json
      - name: Format check
        run: |
          test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Reachable vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.15.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: OpenAPI contract
        working-directory: ${{ github.workspace }}
        run: npx --yes @redocly/cli@2.46.1 lint openapi/openapi.yaml

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amsonia_admin
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: amsonia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amsonia_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.12"
          cache: true
      - name: Integration tests (PostgreSQL)
        env:
          TEST_DATABASE_ADMIN_URL: "postgres://amsonia_admin:test-only@localhost:5432/amsonia_test?sslmode=disable"
        run: go test -tags postgres -count=1 ./postgres/
