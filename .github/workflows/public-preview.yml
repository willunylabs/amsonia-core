name: Public preview install

on:
  pull_request:
    paths:
      - .github/workflows/public-preview.yml
      - scripts/smoke-preview.py
      - scripts/smoke-first-login.cjs
      - scripts/smoke_support.py
  workflow_dispatch:
    inputs:
      tag:
        description: Published preview release tag
        required: true
        default: v0.2.0-preview.2
        type: string

permissions:
  contents: read

jobs:
  public-preview-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag || 'v0.2.0-preview.2' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download and verify the public archive
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]
          df -h "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/public-preview"
          cd "$RUNNER_TEMP/public-preview"
          version="${RELEASE_TAG#v}"
          bundle="amsonia-core-$version-linux-amd64"
          base="https://github.com/willunylabs/amsonia-core/releases/download/$RELEASE_TAG"
          for file in SHA256SUMS "$bundle.tar.gz"; do
            curl --fail --silent --show-error --location --retry 3 --max-time 180 \
              --proto '=https' --proto-redir '=https' --output "$file" "$base/$file"
          done
          sha256sum --check SHA256SUMS
          tar -xzf "$bundle.tar.gz"
          test "$(cat "$bundle/VERSION")" = "$version"
          revision="$(git ls-remote https://github.com/willunylabs/amsonia-core.git \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" | tail -1 | cut -f1)"
          test -n "$revision"
          test "$(cat "$bundle/REVISION")" = "$revision"
          echo "Verified public download: $RELEASE_TAG at $revision"
          for image in api web postgres; do
            if docker image inspect "amsonia-core-$image:$version" >/dev/null 2>&1; then
              echo "Unexpected preloaded release image: $image" >&2
              exit 1
            fi
          done
      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
      - name: Prepare Chromium for browser verification
        run: |
          npm install --prefix "$RUNNER_TEMP/preview-browser" --no-save --no-package-lock playwright@1.58.2
          "$RUNNER_TEMP/preview-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Install and sign in from a clean browser
        run: |
          python3 -B scripts/smoke-preview.py "$RUNNER_TEMP/public-preview/amsonia-core-${RELEASE_TAG#v}-linux-amd64" \
            --browser-module "$RUNNER_TEMP/preview-browser/node_modules/playwright" \
            --screenshots "$RUNNER_TEMP/public-preview/screenshots"
      - uses: actions/upload-artifact@v7
        with:
          name: public-preview-first-login
          path: ${{ runner.temp }}/public-preview/screenshots/*.png
          if-no-files-found: error
          retention-days: 7
