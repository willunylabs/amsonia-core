name: Public preview install

on:
  pull_request:
    paths:
      - .github/workflows/public-preview.yml
      - deploy/preview/README.md
      - scripts/download-public-preview.sh
      - scripts/smoke-preview-upgrade.py
      - scripts/smoke-first-login.cjs
  workflow_dispatch:
    inputs:
      tag:
        description: Published preview release tag
        required: true
        type: string

      from_tag:
        description: Optional source preview tag for an in-place upgrade
        type: string

permissions:
  contents: read

jobs:
  public-preview-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select and record published preview versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_FROM_TAG: ${{ inputs.from_tag }}
        run: |
          target="$INPUT_TAG"
          source="$INPUT_FROM_TAG"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            releases="$(gh api "repos/$GH_REPO/releases" --jq '
              [.[] | select(.draft == false and .prerelease == true and
                (.tag_name | test("^v[0-9]+[.][0-9]+[.][0-9]+-preview[.][0-9]+$")))] |
              sort_by(.published_at) | reverse | .[:2] | .[].tag_name')"
            mapfile -t tags <<< "$releases"
            test "${#tags[@]}" = 2
            target="${tags[0]}"
            source="${tags[1]}"
          fi
          preview_tag='^v[0-9]+[.][0-9]+[.][0-9]+-preview[.][0-9]+$'
          [[ "$target" =~ $preview_tag ]]
          if [[ -n "$source" ]]; then
            [[ "$source" =~ $preview_tag && "$source" != "$target" ]]
          fi
          # Immutable historical archives keep the checks their UI supports.
          # Current candidate bundles always run all checks in preview.yml.
          case "$target" in
            v0.2.0-preview.2|v0.2.0-preview.3) contract=published-preview-2-3 ;;
            v0.2.0-preview.4) contract=published-preview-4 ;;
            v0.2.0-preview.5) contract=published-preview-5 ;;
            *) contract=current ;;
          esac
          printf 'RELEASE_TAG=%s\nFROM_TAG=%s\nSMOKE_CONSOLE_CONTRACT=%s\n' \
            "$target" "$source" "$contract" >> "$GITHUB_ENV"
          echo "Public archive: $target; upgrade source: ${source:-none}; Console contract: $contract"
      - name: Download and verify the public archive
        run: |
          df -h "$RUNNER_TEMP"
          bash scripts/download-public-preview.sh "$RELEASE_TAG" "$RUNNER_TEMP/public-preview"
          if [[ -n "$FROM_TAG" ]]; then
            test "$FROM_TAG" != "$RELEASE_TAG"
            bash scripts/download-public-preview.sh "$FROM_TAG" "$RUNNER_TEMP/old-preview"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
      - name: Prepare Chromium for browser verification
        timeout-minutes: 6
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "60000"
        run: |
          npm install --prefix "$RUNNER_TEMP/preview-browser" --no-save --no-package-lock --fetch-retries=2 --fetch-timeout=60000 playwright@1.58.2
          "$RUNNER_TEMP/preview-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Install and sign in from a clean browser
        if: ${{ !env.FROM_TAG }}
        run: |
          python3 -B scripts/smoke-preview.py "$RUNNER_TEMP/public-preview/amsonia-core-${RELEASE_TAG#v}-linux-amd64" \
            --browser-module "$RUNNER_TEMP/preview-browser/node_modules/playwright" \
            --screenshots "$RUNNER_TEMP/public-preview/screenshots"
      - name: Back up and upgrade an existing installation
        if: ${{ env.FROM_TAG != '' }}
        run: |
          python3 -B scripts/smoke-preview-upgrade.py \
            "$RUNNER_TEMP/old-preview/amsonia-core-${FROM_TAG#v}-linux-amd64" \
            "$RUNNER_TEMP/public-preview/amsonia-core-${RELEASE_TAG#v}-linux-amd64" \
            "$RUNNER_TEMP/preview-browser/node_modules/playwright" \
            "$RUNNER_TEMP/public-preview/screenshots"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: public-preview-first-login
          path: ${{ runner.temp }}/public-preview/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
